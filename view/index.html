<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>antfarm · view</title>
  <link rel="stylesheet" href="/view.css">
</head>
<body data-status="connecting">
  <header>
    <h1>antfarm · view</h1>
    <dl id="header-fields">
      <div><dt>channel</dt><dd id="channel">—</dd></div>
      <div><dt>match</dt><dd id="match">—</dd></div>
      <div><dt>game</dt><dd id="game">—</dd></div>
      <div><dt>graph</dt><dd id="version">—</dd></div>
      <div><dt>status</dt><dd id="match-status">—</dd></div>
      <div><dt>connection</dt><dd id="connection">opening</dd></div>
    </dl>
  </header>
  <main>
    <svg id="graph" viewBox="0 0 1000 700" role="img" aria-label="match graph">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z"></path>
        </marker>
      </defs>
      <g id="layer-edges"></g>
      <g id="layer-nodes"></g>
      <g id="layer-dots"></g>
    </svg>
    <aside>
      <section id="detail">
        <h2 id="detail-title">Detail</h2>
        <pre id="detail-json">Click a node, an edge or a dot: the raw event shows up here.</pre>
      </section>
      <section id="log">
        <h2>Events</h2>
        <ol id="event-log" reversed></ol>
      </section>
    </aside>
  </main>
  <script src="/view.js"></script>
</body>
</html>
